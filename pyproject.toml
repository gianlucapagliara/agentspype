[project]
name = "agentspype"
version = "0.8.1"
description = "A framework for building agents that interact with the world"
authors = [{ name = "Gianluca Pagliara", email = "pagliara.gianluca@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12,<3",
    "python-statemachine>=3.0.0,<4",
    "pydot>=3.0.3,<4",
    "bidict>=0.23.1,<1",
    "eventspype>=1.2.0,<2",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
clock = ["chronopype>=0.7.0,<1"]
wizard = ["pydantic-wizard>=0.1.0,<1"]
service = ["processpype>=2.0.0"]

[project.scripts]
agentspype = "agentspype.runner.cli:main"

[project.urls]
Homepage = "https://github.com/gianlucapagliara/agentspype"
Repository = "https://github.com/gianlucapagliara/agentspype"
Issues = "https://github.com/gianlucapagliara/agentspype/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "pytest-timeout>=2.3",
    "mypy>=1.7.0",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
    "ruff>=0.8.4",
    "pre-commit>=4.0",
]
docs = ["mkdocs>=1.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
strict = true
disallow_untyped_decorators = false
ignore_missing_imports = true
disable_error_code = ["misc", "type-abstract", "union-attr", "no-untyped-call"]
exclude = ["agentspype/service/"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Ignore unused imports in __init__ files
"tests/test_service/**" = ["E402"]  # Imports after pytest.importorskip

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
testpaths = ["tests"]
